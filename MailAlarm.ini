; Mail Alarm yapılandırma dosyası
; UseSSL: 0 = şifresiz, 1 = SSL/TLS (port 993), 2 = STARTTLS (port 143)
[IMAP]
Server=imap.gmail.com
Port=993
UseSSL=1
Username=kullanici@gmail.com
Password=uygulama_sifresi

[Filter]
SenderAddress=alarm@example.com
Keywords=ALARM,HATA,KRİTİK,ERROR,CRITICAL
CheckIntervalSeconds=60

[App]
PlaySound=1
StartMinimized=1
