; Mail Alarm yapılandırma dosyası
; UseSSL: 0 = şifresiz, 1 = SSL/TLS (port 995), 2 = STARTTLS (port 110)
[POP3]
Server=pop.gmail.com
Port=995
UseSSL=1
Username=kullanici@gmail.com
Password=uygulama_sifresi

[Filter]
; SenderAddress boş veya * ise tüm gönderenler izlenir
SenderAddress=
Keywords=ALARM,HATA,KRİTİK,ERROR,CRITICAL
CheckIntervalSeconds=60

[App]
PlaySound=1
StartMinimized=1
